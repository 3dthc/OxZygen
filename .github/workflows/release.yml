# Builds OxZygen for MPC (Gen1 armv7 and Gen2 aarch64) and its desktop VST3 (macOS, Windows) in GitHub Actions and
# attaches every zip to a DRAFT release. Run it from the Actions tab ("Release" > Run workflow, enter the version).
# Install the MPC zip on a device, check it, then publish the draft: publishing creates the tag.
# ./build.sh stays the local build; this uses mpc-vst-plugins' reusable workflow, pinned to one commit in both places below.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.7.5
        required: true
        type: string
      dry_run:
        description: Build and package only (the zips and page previews as run artifacts), no draft release
        type: boolean
        default: false

jobs:
  vst:
    uses: 3dthc/mpc-vst-plugins/.github/workflows/vst-release.yml@d0bbf09f3407621ebe00ebe74e7086fdef76954c
    permissions: { contents: write }
    secrets: inherit   # optional Apple signing/notarization (mpc-vst-plugins docs/DESKTOP_VST3.md)
    with:
      tag: oxzygen-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: d0bbf09f3407621ebe00ebe74e7086fdef76954c
      vst_dir: vst
      build: '"$MPC_VST/tools/build_port.sh" vst/vst.json all'
      host_test: '"$MPC_VST/tools/test_port.sh" vst/vst.json'
      extra: vst/data:samples
      about: 'OxZygen: two sound slots (voices, winds, brass, strings, bells, synth, air), filter, lo-fi, drive, delay, reverb, sub; 96 presets'
      plugin_id: oxzygen
      license: MIT
      dry_run: ${{ inputs.dry_run }}
      desktop: true
      desktop_data: vst/data
