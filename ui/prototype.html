<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>OxZygen</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a fixed 1280x800 hardware-style panel, scaled to fit. Left and right control banks flank a recessed orb well; keys run the full width. */
/* Palette: gunmetal and black, engraved silver labels, one cold teal for live values, one brass for selected state. */
:root {
  --bg: #07090c;
  --bezel: #12161d;
  --well: #05070a;
  --panel: #0e1218;
  --seam: #232a35;
  --metal-hi: #8a94a6;
  --metal-lo: #2c3442;
  --fg: #e4e9f1;
  --dim: #6f7a8c;
  --live: #6fe0d6;
  --brass: #d1a85c;
  --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --bg: #07090c; color-scheme: dark; }
}
:root[data-theme="light"] { --bg: #07090c; color-scheme: dark; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 13px/1.4 var(--mono);
  overflow: hidden;
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));
}
.stage {
  width: 1280px; height: 800px;
  transform-origin: top left;
  position: relative;
  background: var(--bezel);
  border: 1px solid #000;
  box-shadow: inset 0 1px 0 #2c3442, inset 0 -2px 0 #05070a;
  overflow: hidden;
}
.top {
  height: 60px; display: flex; align-items: center; gap: 20px; padding: 0 20px;
  background: linear-gradient(180deg, #1a202a 0%, #0e1218 100%);
  border-bottom: 1px solid #000;
  box-shadow: inset 0 1px 0 #3a4352;
}
.logo { font: 700 28px/1 var(--cond); letter-spacing: .22em; text-transform: uppercase; color: var(--fg); padding-right: 14px; border-right: 1px solid var(--seam); }
.logo b { color: var(--live); font-weight: 700; }
.tabs { display: flex; gap: 4px; margin-left: 12px; }
.tab, .btn {
  height: 36px; min-width: 92px; padding: 0 16px;
  border-radius: 3px;
  border: 1px solid #000;
  background: linear-gradient(180deg, #2a313d 0%, #161b24 100%);
  box-shadow: inset 0 1px 0 #465064, 0 1px 0 #000;
  color: var(--fg);
  font: 600 17px var(--cond); letter-spacing: .12em; text-transform: uppercase;
  cursor: pointer;
}
.tab:active, .btn:active { transform: translateY(1px); }
.tab[aria-selected="true"] {
  background: linear-gradient(180deg, #3a2f1c 0%, #1d1810 100%);
  color: var(--brass);
  box-shadow: inset 0 1px 0 #6b5630, 0 0 0 1px #000;
}
.btn:focus-visible, .tab:focus-visible, .knob:focus-visible, .key:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
.preset { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.lcd {
  min-width: 300px; height: 44px; padding: 0 16px;
  display: flex; align-items: center; justify-content: space-between;
  background: #03060a; border: 1px solid #000; border-radius: 2px;
  box-shadow: inset 0 2px 6px #000;
  font: 500 19px var(--mono); color: var(--live); letter-spacing: .04em;
}
.lcd small { font: 600 14px var(--cond); letter-spacing: .16em; color: var(--dim); text-transform: uppercase; }
.preset .btn { min-width: 36px; padding: 0; font-size: 12px; }

.view { position: absolute; top: 60px; bottom: 0; left: 0; right: 0; }
.view[hidden] { display: none !important; }

/* PLAYER */
.player { display: grid; grid-template-columns: 1fr 380px 1fr; height: 100%; }
.side { padding: 20px 22px 0; display: flex; flex-direction: column; gap: 14px; }
.side h3 {
  margin: 0; font: 600 17px var(--cond); letter-spacing: .2em; color: var(--dim); text-transform: uppercase;
  display: flex; align-items: center; gap: 10px;
}
.side h3::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--seam), transparent); }
.knobs { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 14px; justify-items: center; }

.center { display: flex; flex-direction: column; align-items: center; padding-top: 12px; }
.well { width: 380px; height: 380px; position: relative; }
.well svg.ring { position: absolute; inset: 0; width: 380px; height: 380px; pointer-events: none; }
canvas#orb {
  position: absolute; top: 20px; left: 20px;
  width: 340px; height: 340px; display: block; cursor: pointer;
  border-radius: 50%;
  box-shadow: 0 22px 48px -10px rgba(0,0,0,.85);
}
.caption { margin-top: 10px; width: 380px; display: flex; justify-content: center; }
.caption .readout { font: 500 16px var(--mono); color: var(--dim); letter-spacing: .1em; text-transform: uppercase; font-variant-numeric: tabular-nums; }

/* KNOB */
.knob { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: ns-resize; user-select: none; touch-action: none; }
.knob svg { width: 104px; height: 104px; display: block; }
.knob .kv {
  min-width: 52px; text-align: center; padding: 2px 6px;
  font-size: 16px; color: var(--live); background: #03060a; border: 1px solid #000; border-radius: 2px;
  font-variant-numeric: tabular-nums;
}
.knob .kl { font: 600 16px var(--cond); letter-spacing: .12em; color: var(--fg); text-transform: uppercase; }
.knob .kt { fill: none; stroke: #000; stroke-width: 6; }
.knob .kr { fill: none; stroke: #1c2330; stroke-width: 1; }
.knob .ks { stroke: #5c6678; stroke-width: 1.4; }
.knob .kslot { stroke: #03060a; stroke-width: 3; stroke-linecap: butt; }
.knob .ka { fill: none; stroke: var(--live); stroke-width: 3; stroke-linecap: butt; }
.knob .kc { stroke: #000; stroke-width: 1; }
.knob .kind { stroke: #f1f5fb; stroke-width: 2.4; stroke-linecap: round; }

/* KEYS */
.keys {
  position: absolute; left: 0; right: 0; bottom: 0; height: 128px;
  background: #06080c; border-top: 1px solid #000;
  box-shadow: inset 0 2px 0 #1a202a;
}
.key {
  position: absolute; top: 0; bottom: 0;
  border: 1px solid #000; border-top: 0;
  background: linear-gradient(180deg, #d9dfe9 0%, #aab3c2 88%, #7d8799 100%);
  cursor: pointer;
}
.key.black {
  height: 62%; z-index: 2;
  background: linear-gradient(180deg, #2d3441 0%, #0a0d12 100%);
  border-color: #000;
  box-shadow: 1px 0 0 #000 inset, -1px 0 0 #3a4352 inset;
}
.key.on { background: linear-gradient(180deg, #cdf7f1 0%, var(--live) 100%); }
.key.black.on { background: linear-gradient(180deg, #2f6f69 0%, #173835 100%); }

/* EDIT */
.edit { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; gap: 14px; padding: 20px; height: 100%; box-sizing: border-box; }
.layer {
  background: var(--panel); border: 1px solid #000; border-radius: 3px;
  box-shadow: inset 0 1px 0 #232a35;
  padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0;
}
.layer header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.layer h4 { margin: 0; font: 700 17px var(--cond); letter-spacing: .22em; text-transform: uppercase; }
.layer .btn { min-width: 0; height: 28px; padding: 0 12px; font-size: 12px; }
.layer .btn[aria-pressed="true"] { color: var(--brass); box-shadow: inset 0 1px 0 #6b5630, 0 0 0 1px #000; }
.layer .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; justify-items: center; }
.layer .knob svg { width: 78px; height: 78px; }

/* FX */
.fx { display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: 1fr 1fr; gap: 14px; padding: 20px; height: 100%; box-sizing: border-box; }
.module {
  background: var(--panel); border: 1px solid #000; border-radius: 3px;
  box-shadow: inset 0 1px 0 #232a35;
  padding: 16px 20px; display: flex; flex-direction: column; gap: 14px;
}
.module h4 { margin: 0; font: 700 17px var(--cond); letter-spacing: .22em; text-transform: uppercase; }
.module .row { display: flex; justify-content: space-around; align-items: center; flex: 1; flex-wrap: wrap; gap: 14px; }
.module .knob svg { width: 96px; height: 96px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9aa4b6"/>
      <stop offset=".45" stop-color="#3c4454"/>
      <stop offset="1" stop-color="#171c25"/>
    </linearGradient>
    <linearGradient id="capRing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20262f"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
  </defs>
</svg>

<div class="stage" id="stage">
  <header class="top">
    <div class="logo">Ox<b>Zygen</b></div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-view="player">Player</button>
      <button class="tab" role="tab" aria-selected="false" data-view="edit">Edit</button>
      <button class="tab" role="tab" aria-selected="false" data-view="fx">FX</button>
    </nav>
    <div class="preset">
      <button class="btn" id="prev" aria-label="Previous preset">&#9664;</button>
      <div class="lcd"><small>Preset</small><span id="presetName">Saint Air</span></div>
      <button class="btn" id="next" aria-label="Next preset">&#9654;</button>
    </div>
  </header>

  <!-- PLAYER -->
  <section class="view" id="v-player" data-view="player">
    <div class="player">
      <div class="side" id="left">
        <h3>Voice</h3>
        <div class="knobs" id="leftKnobs"></div>
      </div>
      <div class="center">
        <div class="well">
          <svg class="ring" id="ring" viewBox="0 0 380 380" aria-hidden="true"></svg>
          <canvas id="orb" width="680" height="680" aria-label="Orb. Press to add energy."></canvas>
        </div>
        <div class="caption">
          <div class="readout" id="orbSub">0 voices</div>
        </div>
      </div>
      <div class="side" id="right">
        <h3>Atmosphere</h3>
        <div class="knobs" id="rightKnobs"></div>
      </div>
    </div>
    <div class="keys" id="keys"></div>
  </section>

  <!-- EDIT -->
  <section class="view" id="v-edit" data-view="edit" hidden>
    <div class="edit" id="editGrid"></div>
  </section>

  <!-- FX -->
  <section class="view" id="v-fx" data-view="fx" hidden>
    <div class="fx">
      <div class="module"><h4>Reverb</h4><div class="row" data-mod="reverb"></div></div>
      <div class="module"><h4>Delay</h4><div class="row" data-mod="delay"></div></div>
      <div class="module"><h4>Drive</h4><div class="row" data-mod="drive"></div></div>
      <div class="module"><h4>Sub</h4><div class="row" data-mod="sub"></div></div>
    </div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

// Knob geometry on a 100-unit viewBox: value arc sits on radius 36, sweeping 270 degrees from 135.
const ARC_R = 36;
function pt(deg, r = ARC_R) { const a = deg * Math.PI / 180; return [50 + r * Math.cos(a), 50 + r * Math.sin(a)]; }
function arcPath(v) {
  if (v <= 0.001) return "";
  const [x0, y0] = pt(135), [x1, y1] = pt(135 + 270 * v);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${ARC_R} ${ARC_R} 0 ${270 * v > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function ticksSVG() {
  let out = "";
  for (let i = 0; i <= 10; i++) {
    const deg = 135 + i * 27;
    const [x0, y0] = pt(deg, 42), [x1, y1] = pt(deg, i % 5 === 0 ? 47 : 45);
    out += `<line class="ks" x1="${x0.toFixed(2)}" y1="${y0.toFixed(2)}" x2="${x1.toFixed(2)}" y2="${y1.toFixed(2)}"/>`;
  }
  return out;
}
function knobHTML(id, label, v, size) {
  return `<div class="knob" tabindex="0" role="slider" aria-label="${label}" aria-valuemin="0" aria-valuemax="100" data-id="${id}" data-v="${v}">
    <svg viewBox="0 0 100 100" style="width:${size}px;height:${size}px" aria-hidden="true">
      <circle class="kr" cx="50" cy="50" r="48"/>
      ${ticksSVG()}
      <path class="kslot" d="M${pt(135)[0]} ${pt(135)[1]} A36 36 0 1 1 ${pt(45)[0]} ${pt(45)[1]}" fill="none"/>
      <path class="ka" d="${arcPath(v)}"/>
      <circle cx="50" cy="50" r="26" fill="url(#cap)" class="kc"/>
      <circle cx="50" cy="50" r="22" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="1"/>
      <line class="kind" x1="50" y1="50" x2="${pt(135 + 270 * v, 18)[0]}" y2="${pt(135 + 270 * v, 18)[1]}"/>
    </svg>
    <span class="kv">${Math.round(v * 100)}</span>
    <span class="kl">${label}</span>
  </div>`;
}
function setKnob(el, v) {
  v = Math.max(0, Math.min(1, v));
  el.dataset.v = v;
  el.querySelector(".ka").setAttribute("d", arcPath(v));
  const [ix, iy] = pt(135 + 270 * v, 18);
  el.querySelector(".kind").setAttribute("x2", ix.toFixed(2));
  el.querySelector(".kind").setAttribute("y2", iy.toFixed(2));
  el.querySelector(".kv").textContent = Math.round(v * 100);
  el.setAttribute("aria-valuenow", Math.round(v * 100));
  state[el.dataset.id] = v;
}

// Shared state, so Edit and FX stay consistent with the Player macros.
const state = {
  voice: .42, breath: .58, choir: .7, bells: .35,
  air: .62, dark: .55, space: .66, motion: .48
};

function fill(container, list, size) {
  container.innerHTML = list.map(([id, label]) => knobHTML(id, label, state[id] ?? .5, size)).join("");
}
fill($("#leftKnobs"), [["voice", "Voice"], ["breath", "Breath"], ["choir", "Choir"], ["bells", "Bells"]], 104);
fill($("#rightKnobs"), [["air", "Air"], ["dark", "Dark"], ["space", "Space"], ["motion", "Motion"]], 104);

// Edit: one card per layer, each with its own knobs and mute/solo.
const layers = [
  ["Choir", ["Vowel", "Attack", "Spread", "Level"]],
  ["Vowels", ["Morph", "Attack", "Formant", "Level"]],
  ["Winds", ["Breath", "Vibrato", "Tone", "Level"]],
  ["Bells", ["Strike", "Decay", "Shimmer", "Level"]],
  ["Soundscape", ["Density", "Drift", "Width", "Level"]],
  ["Texture", ["Grain", "Pitch", "Smear", "Level"]]
];
$("#editGrid").innerHTML = layers.map(([name, knobs], i) => `
  <div class="layer">
    <header><h4>${name}</h4>
      <div style="display:flex;gap:6px">
        <button class="btn" aria-pressed="false" data-mute="${i}">Mute</button>
        <button class="btn" aria-pressed="false" data-solo="${i}">Solo</button>
      </div>
    </header>
    <div class="grid">${knobs.map((k, j) => {
      const id = `l${i}_${j}`;
      if (state[id] === undefined) state[id] = .3 + ((i * 7 + j * 13) % 50) / 100;
      return knobHTML(id, k, state[id], 78);
    }).join("")}</div>
  </div>`).join("");

// FX modules.
const fxMods = {
  reverb: [["rvSize", "Size"], ["rvDecay", "Decay"], ["rvMix", "Mix"]],
  delay:  [["dlTime", "Time"], ["dlFb", "Feedback"], ["dlMix", "Mix"]],
  drive:  [["drAmt", "Amount"], ["drTone", "Tone"], ["drMix", "Mix"]],
  sub:    [["subLvl", "Level"], ["subTune", "Tune"], ["subDrop", "Drop"]]
};
Object.entries(fxMods).forEach(([mod, list]) => {
  const row = document.querySelector(`[data-mod="${mod}"]`);
  list.forEach(([id]) => { if (state[id] === undefined) state[id] = .45; });
  row.innerHTML = list.map(([id, label]) => knobHTML(id, label, state[id], 96)).join("");
});

// Keys: two octaves of white keys with black keys between.
const keysEl = $("#keys");
const whiteCount = 15, keyW = 1280 / whiteCount;
const keyChunks = [];
for (let i = 0; i < whiteCount; i++) {
  const el = document.createElement("div");
  el.className = "key"; el.tabIndex = 0; el.setAttribute("role", "button");
  el.style.left = (i * keyW) + "px"; el.style.width = (keyW - 1) + "px";
  keysEl.appendChild(el);
  keyChunks.push(el);
}
for (let i = 0; i < whiteCount - 1; i++) {
  if ([0, 1, 3, 4, 5].includes(i % 7)) {
    const b = document.createElement("div");
    b.className = "key black"; b.tabIndex = 0; b.setAttribute("role", "button");
    b.style.left = ((i + 1) * keyW - 22) + "px"; b.style.width = "44px";
    keysEl.appendChild(b);
    keyChunks.push(b);
  }
}

// Voices and orb energy.
let voices = 0, energy = 0;
const held = new Map();
function noteOn(el, id) {
  if (held.has(id)) return;
  held.set(id, el);
  el.classList.add("on");
  voices++;
  energy = Math.min(1.6, energy + .5);
}
function noteOff(id) {
  const el = held.get(id);
  if (!el) return;
  el.classList.remove("on");
  held.delete(id);
  voices = Math.max(0, voices - 1);
}
keyChunks.forEach((el, i) => {
  el.addEventListener("pointerdown", e => { e.preventDefault(); noteOn(el, i); });
  el.addEventListener("pointerup", () => noteOff(i));
  el.addEventListener("pointerleave", () => noteOff(i));
  el.addEventListener("pointercancel", () => noteOff(i));
});

// Knob dragging (vertical drag; arrow keys when focused).
let drag = null;
document.addEventListener("pointerdown", e => {
  const k = e.target.closest(".knob");
  if (!k) return;
  drag = { el: k, y: e.clientY, v: parseFloat(k.dataset.v) };
});
document.addEventListener("pointermove", e => {
  if (!drag) return;
  setKnob(drag.el, drag.v + (drag.y - e.clientY) / 160);
});
document.addEventListener("pointerup", () => drag = null);
document.addEventListener("keydown", e => {
  const k = document.activeElement;
  if (!k || !k.classList || !k.classList.contains("knob")) return;
  const d = e.key === "ArrowUp" || e.key === "ArrowRight" ? .02 : e.key === "ArrowDown" || e.key === "ArrowLeft" ? -.02 : 0;
  if (d) setKnob(k, parseFloat(k.dataset.v) + d);
});
function refreshAll() {
  $$(".knob").forEach(k => { if (state[k.dataset.id] !== undefined) setKnob(k, state[k.dataset.id]); });
}

// Tabs.
$$(".tab").forEach(t => t.addEventListener("click", () => {
  $$(".tab").forEach(x => x.setAttribute("aria-selected", x === t ? "true" : "false"));
  $$(".view").forEach(v => v.hidden = v.dataset.view !== t.dataset.view);
  refreshAll();
}));
$$("[data-mute], [data-solo]").forEach(b => b.addEventListener("click", () => {
  b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
}));

// Presets: placeholder names for the prototype.
const presets = ["Saint Air", "Celtic Hall", "Choir Drift", "Dark Vowel Bed", "Ocarina Night"];
let pIdx = 0;
function setPreset(i) {
  pIdx = (i + presets.length) % presets.length;
  $("#presetName").textContent = presets[pIdx];
}
$("#prev").addEventListener("click", () => setPreset(pIdx - 1));
$("#next").addEventListener("click", () => setPreset(pIdx + 1));

// Crystal orb: a faceted glass sphere with thin luminous wisps that curl and rise.
// Motion sets wisp speed, Air sets how many form, Space sets how far they travel, playing adds energy.
const cv = $("#orb"), ctx = cv.getContext("2d");
const W = 340, R = 160, C = W / 2;
const wisps = [];
function spawnWisp() {
  const a = Math.random() * Math.PI * 2;
  const r = Math.random() * R * .55;
  wisps.push({
    x: C + Math.cos(a) * r, y: C + Math.sin(a) * r + 30,
    dir: -Math.PI / 2 + (Math.random() - .5) * .8,
    phase: Math.random() * 10,
    pts: [],
    life: 1,
    hue: Math.random() < .55 ? 0 : 1,
    w: .6 + Math.random() * 1.4
  });
}
function drawOrb() {
  const dpr = 2;
  const motion = state.motion, air = state.air, space = state.space;
  energy *= .975;
  const intensity = Math.min(1.6, energy + voices * .2);
  const spawnChance = Math.min(1, .08 + air * .2 + intensity * .25);
  if (Math.random() < spawnChance) spawnWisp();

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, W);
  ctx.save();
  ctx.beginPath(); ctx.arc(C, C, R, 0, Math.PI * 2); ctx.clip();

  // Glass body: dark, with sharp limb darkening rather than a soft glow.
  const body = ctx.createRadialGradient(C - 30, C - 40, 6, C, C, R);
  body.addColorStop(0, "#1c2634");
  body.addColorStop(.55, "#0a0f17");
  body.addColorStop(.92, "#04060a");
  body.addColorStop(1, "#000");
  ctx.fillStyle = body; ctx.fillRect(0, 0, W, W);

  // Faint facet lines inside the glass, like cut crystal.
  ctx.strokeStyle = "rgba(160,200,220,.06)";
  ctx.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const a = i * Math.PI / 3 + .3;
    ctx.beginPath();
    ctx.moveTo(C + Math.cos(a) * R, C + Math.sin(a) * R);
    ctx.lineTo(C - Math.cos(a) * R * .2, C - Math.sin(a) * R * .2);
    ctx.stroke();
  }

  // Wisps: thin trails with a tapered fade.
  ctx.lineCap = "round";
  const speed = .5 + motion * 1.4;
  for (let i = wisps.length - 1; i >= 0; i--) {
    const wsp = wisps[i];
    wsp.phase += .03 * speed;
    wsp.dir += Math.sin(wsp.phase) * .03 * speed * (.5 + space);
    const step = (.5 + space * .8) * speed;
    wsp.x += Math.cos(wsp.dir) * step;
    wsp.y += Math.sin(wsp.dir) * step - .3 * speed;
    wsp.pts.push([wsp.x, wsp.y]);
    if (wsp.pts.length > 60) wsp.pts.shift();
    wsp.life -= .0035 * (1.2 - air * .5);
    if (wsp.life <= 0 || Math.hypot(wsp.x - C, wsp.y - C) > R - 6) { wisps.splice(i, 1); continue; }
    const col = wsp.hue ? "138,127,230" : "111,224,214";
    const base = Math.max(0, wsp.life) * (.25 + intensity * .25);
    for (let k = 1; k < wsp.pts.length; k++) {
      const t = k / wsp.pts.length;
      const [x0, y0] = wsp.pts[k - 1], [x1, y1] = wsp.pts[k];
      ctx.strokeStyle = `rgba(${col},${(base * t).toFixed(3)})`;
      ctx.lineWidth = wsp.w * (.4 + t * 1.2);
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }
  }

  // Inner energy: a tight core that brightens with playing, not a wide haze.
  const core = ctx.createRadialGradient(C, C + 10, 0, C, C + 10, 80);
  core.addColorStop(0, `rgba(111,224,214,${(.06 + intensity * .09).toFixed(3)})`);
  core.addColorStop(1, "rgba(111,224,214,0)");
  ctx.fillStyle = core; ctx.fillRect(0, 0, W, W);

  // Hard specular window reflection.
  ctx.save();
  ctx.translate(C - 58, C - 66);
  ctx.rotate(-.6);
  ctx.beginPath(); ctx.ellipse(0, 0, 34, 10, 0, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(235,245,255,.18)"; ctx.fill();
  ctx.restore();
  ctx.restore();

  // Edge: a single fine bevel line, no coloured ring.
  ctx.beginPath(); ctx.arc(C, C, R - 1, 0, Math.PI * 2);
  ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,255,255,.07)"; ctx.stroke();

  $("#orbSub").textContent = `${voices} voice${voices === 1 ? "" : "s"}`;
  const lit = Math.round(Math.min(1, intensity) * 60);
  ringEl.querySelectorAll(".rt").forEach((ln, i) => ln.classList.toggle("lit", i < lit && i % 5 === 0));
  requestAnimationFrame(drawOrb);
}
cv.addEventListener("pointerdown", () => { energy = Math.min(1.6, energy + .6); });

// Scale ring around the orb, in the same tick language as the knobs. Major tick every 5th, and it lights with voices.
const ringEl = $("#ring");
let ringHTML = "";
for (let i = 0; i < 60; i++) {
  const a = i * 6 * Math.PI / 180 - Math.PI / 2;
  const major = i % 5 === 0;
  const r0 = 178, r1 = major ? 168 : 173;
  ringHTML += `<line class="rt${major ? " major" : ""}" x1="${(190 + Math.cos(a) * r0).toFixed(2)}" y1="${(190 + Math.sin(a) * r0).toFixed(2)}" x2="${(190 + Math.cos(a) * r1).toFixed(2)}" y2="${(190 + Math.sin(a) * r1).toFixed(2)}"/>`;
}
ringEl.innerHTML = ringHTML;
const ringStyle = document.createElement("style");
ringStyle.textContent = ".rt{stroke:#3a4352;stroke-width:1.2;transition:stroke .2s}.rt.major{stroke:#6b7588;stroke-width:1.6}.rt.lit{stroke:var(--live)}";
document.head.appendChild(ringStyle);

// Initial render.
$$(".knob").forEach(k => setKnob(k, state[k.dataset.id] ?? .5));
requestAnimationFrame(drawOrb);
setPreset(0);

// Fit the 1280x800 stage into the viewer, keeping proportions.
const stage = $("#stage");
function fit() {
  const s = Math.min(innerWidth / 1280, innerHeight / 800);
  stage.style.transform = `scale(${s})`;
  stage.style.marginLeft = `${(innerWidth - 1280 * s) / 2}px`;
  stage.style.marginTop = `${(innerHeight - 800 * s) / 2}px`;
}
addEventListener("resize", fit);
fit();
</script>
</body>
</html>
